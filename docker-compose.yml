services:
  postgres:
    image: postgres:13
    container_name: lionera_postgres_copy
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  notification_postgres:
    image: postgres:13
    container_name: lionera_notification_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB}
    ports:
    - "5433:5432"
    volumes:
    - notification_postgres_data:/var/lib/postgresql/data
  mongo_db:
    image: mongo:latest
    container_name: lionera_mongo_copy
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  
  review_mongo:
    image: mongo:latest
    container_name: lionera_review_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27018:27017"
    volumes:
      - review_mongo_data:/data/db

  backend:
    build: ./backend
    container_name: lionera_backend_copy
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/${POSTGRES_DB}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD_ENCODED}@mongo_db:27017?
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      APP_URL: http://backend:5000
      NOTIFICATION_SERVICE_URL: http://notification_service:5002
      REVIEW_SERVICE_URL: http://review_service:5001
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL}
      CRON_SECRET: ${CRON_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - mongo_db

  review_service:
    build: ./review_service
    container_name: lionera_review_service
    restart: always
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD_ENCODED}@review_mongo:27017/review_service?authSource=admin
      PORT: 5001
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    ports:
      - "5001:5001"
    depends_on:
      - review_mongo

  notification_service:
    build: ./notification_service
    container_name: lionera_notification_service
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_ENCODED}@notification_postgres:5432/${NOTIFICATION_POSTGRES_DB}
      PORT: 5002
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      CRON_SECRET: ${CRON_SECRET}
    ports:
      - "5002:5002"
    depends_on:
      - notification_postgres

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: lionera_frontend_copy
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  notification_postgres_data:
  mongo_data:
  review_mongo_data: