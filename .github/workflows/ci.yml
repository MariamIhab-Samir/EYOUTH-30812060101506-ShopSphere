name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: 
      fail-fast: false
      matrix: [backend, frontend, notification_service, review_service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{matrix.service}}/package-lock.json
      - name: Install dependencies
        working-dirctory: ./${{matrix.service}}
        run: npm ci
      - name: Run tests
        working-directory: ./${{matrix.service}}
        run: npm test