apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: code-copy-copy2-copy-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD_ENCODED
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: POSTGRES_PASSWORD_ENCODED}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: POSTGRES_DB}
            - name: MONGO_USER
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: MONGO_USER}
            - name: MONGO_PASSWORD_ENCODED
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: MONGO_PASSWORD_ENCODED}
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD_ENCODED)@postgres:5432/$(POSTGRES_DB)"
            - name: MONGO_URI
              value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD_ENCODED)@mongo-db:27017"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: SMTP_HOST}
            - name: SMTP_PORT
              valueFrom:
                  secretKeyRef: {name: backend-secrets, key: SMTP_PORT}
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: SMTP_SECURE}
            - name: SMTP_USER
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: SMTP_USER}
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: SMTP_PASS}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: JWT_SECRET}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: ADMIN_EMAIL}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: ADMIN_PASSWORD}
            - name: TEST_USER_EMAIL
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: TEST_USER_EMAIL}
            - name: TEST_USER_PASSWORD
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: TEST_USER_PASSWORD}
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: WEBHOOK_SECRET}
            - name: LOW_STOCK_THRESHOLD
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: LOW_STOCK_THRESHOLD}
            - name: ADMIN_ALERT_EMAIL
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: ADMIN_ALERT_EMAIL}
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: CRON_SECRET}
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef: {name: backend-secrets, key: EMAIL_FROM}
            - name: APP_URL
              value: "http://backend:5000"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:5002"
            - name: REVIEW_SERVICE_URL
              value: "http://review-service:5001"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000